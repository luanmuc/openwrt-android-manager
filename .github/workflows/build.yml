name: OpenWrt管家 - 云端编译

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_CMDLINE_TOOLS: '11076708'
  GRADLE_OPTS: '-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=true -Xmx4096m -XX:+UseParallelGC'
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==================== 第一步：磁盘清理 ====================
      - name: 清理磁盘空间
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h
          echo ""
          echo "=== 内存使用情况 ==="
          free -h
          echo ""

          echo "=== 删除不需要的大型工具 ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/*
          sudo rm -rf /usr/local/lib/android/sdk/platforms/*
          echo "大型工具删除完成"

          echo "=== 清理apt缓存 ==="
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "apt缓存清理完成"

          echo "=== 清理docker镜像 ==="
          docker system prune -af || true
          echo "docker镜像清理完成"

          echo ""
          echo "=== 清理后磁盘空间 ==="
          df -h
          echo ""
          echo "可用空间: $(df -h / | tail -1 | awk '{print $4}')"

      # ==================== 第二步：检出代码 ====================
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 显示提交信息
        run: |
          echo "提交哈希: ${{ github.sha }}"
          echo "提交信息: $(git log -1 --pretty=%B)"
          echo "提交作者: $(git log -1 --pretty=%an)"
          echo "提交时间: $(git log -1 --pretty=%ai)"

      # ==================== 第三步：设置 JDK ====================
      - name: 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: 验证 Java 环境
        run: |
          echo "=== Java 版本 ==="
          java -version
          echo ""
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo ""
          echo "=== 磁盘空间 ==="
          df -h /

      # ==================== 第四步：缓存配置 ====================
      - name: 缓存 Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/gradle.properties
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-
            ${{ runner.os }}-gradle-

      - name: 缓存 Android SDK
        uses: actions/cache@v4
        id: android-sdk-cache
        with:
          path: |
            /usr/local/lib/android/sdk
          key: ${{ runner.os }}-android-sdk-${{ env.ANDROID_COMPILE_SDK }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_CMDLINE_TOOLS }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-${{ env.ANDROID_COMPILE_SDK }}-${{ env.ANDROID_BUILD_TOOLS }}-
            ${{ runner.os }}-android-sdk-${{ env.ANDROID_COMPILE_SDK }}-

      - name: 缓存构建输出
        uses: actions/cache@v4
        with:
          path: |
            app/build
            build
            .gradle
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      # ==================== 第五步：安装 Android SDK ====================
      - name: 安装 Android SDK
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          echo "=== 安装 Android Command-line Tools ==="
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdline-tools.zip
          echo "Command-line Tools 安装完成"

          echo ""
          echo "=== 接受 SDK 许可 ==="
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          echo "许可接受完成"

          echo ""
          echo "=== 安装 SDK 组件 ==="
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          echo "SDK 组件安装完成"

          echo ""
          echo "=== SDK 目录 ==="
          ls -la $ANDROID_HOME
          echo ""
          echo "=== 已安装平台 ==="
          ls -la $ANDROID_HOME/platforms/
          echo ""
          echo "=== 已安装构建工具 ==="
          ls -la $ANDROID_HOME/build-tools/

      - name: 配置 SDK 环境
        run: |
          echo "=== 验证 SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms/
          ls $ANDROID_HOME/build-tools/
          ls $ANDROID_HOME/platform-tools/

          echo ""
          echo "=== 配置 local.properties ==="
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

          echo ""
          echo "=== 磁盘空间 ==="
          df -h /

      # ==================== 第六步：Gradle 配置 ====================
      - name: 配置 Gradle
        run: |
          echo "=== Gradle 配置 ==="
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << EOF
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=true
          org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
          org.gradle.configureondemand=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat ~/.gradle/gradle.properties

          echo ""
          echo "=== 赋予 gradlew 执行权限 ==="
          chmod +x gradlew
          ls -la gradlew

      # ==================== 第七步：编译前检查 ====================
      - name: 编译前环境检查
        run: |
          echo "========================================"
          echo "       编译前环境检查"
          echo "========================================"
          echo ""
          echo "=== Java ==="
          java -version
          echo ""
          echo "=== Gradle ==="
          ./gradlew --version
          echo ""
          echo "=== 磁盘空间 ==="
          df -h
          echo ""
          echo "=== 内存使用 ==="
          free -h
          echo ""
          echo "=== 项目结构 ==="
          find . -name "*.kt" | head -20
          echo ""
          echo "========================================"
          echo "       开始编译"
          echo "========================================"

      # ==================== 第八步：编译 APK ====================
      - name: 编译 Debug APK
        id: build
        run: |
          ./gradlew assembleDebug \
            --info \
            --stacktrace \
            --no-daemon \
            --build-cache \
            2>&1 | tee build.log

          echo ""
          echo "=== 编译结果 ==="
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ 编译成功！"
            ls -lh app/build/outputs/apk/debug/
            echo "APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" >> $GITHUB_ENV
          else
            echo "❌ 编译失败，APK文件未找到"
            exit 1
          fi

      - name: 编译失败时输出错误日志
        if: failure()
        run: |
          echo "========================================"
          echo "       编译失败 - 错误日志"
          echo "========================================"
          echo ""
          echo "=== 最后100行日志 ==="
          tail -100 build.log || true
          echo ""
          echo "=== 错误信息 ==="
          grep -i "error" build.log | tail -30 || true
          echo ""
          echo "=== 异常信息 ==="
          grep -i "exception" build.log | tail -20 || true
          echo ""
          echo "=== 磁盘空间 ==="
          df -h
          echo ""
          echo "=== 内存使用 ==="
          free -h

      # ==================== 第九步：重命名 APK ====================
      - name: 重命名 APK
        if: success()
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          VERSION_NAME="v2.0.0"
          APK_NAME="OpenWrtManager_${VERSION_NAME}_${SHORT_SHA}_debug.apk"

          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$APK_NAME"

          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK_PATH=app/build/outputs/apk/debug/$APK_NAME" >> $GITHUB_ENV

          echo "APK 文件名: $APK_NAME"
          ls -lh app/build/outputs/apk/debug/

      # ==================== 第十步：上传 Artifacts ====================
      - name: 上传 APK 到 Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ==================== 第十一步：编译后信息 ====================
      - name: 编译完成总结
        if: success()
        run: |
          echo "========================================"
          echo "       编译完成！"
          echo "========================================"
          echo ""
          echo "📦 APK 文件名: ${{ env.APK_NAME }}"
          echo "📏 APK 大小: $(numfmt --to=iec $APK_SIZE)"
          echo "🔧 提交哈希: ${{ github.sha }}"
          echo "📅 编译时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "=== 磁盘空间 ==="
          df -h /
          echo ""
          echo "=== 编译耗时 ==="
          echo "请查看工作流运行时间"
          echo ""
          echo "🎉 编译成功！APK 已上传到 Artifacts"

      # ==================== 第十二步：创建 Release ====================
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          body: |
            ## OpenWrt管家 ${{ github.ref_name }}

            ### 📦 下载
            - **APK**: ${{ env.APK_NAME }}

            ### 🔧 构建信息
            - 提交: ${{ github.sha }}
            - 编译时间: ${{ github.event.head_commit.timestamp }}

            ### 📋 变更内容
            ${{ github.event.head_commit.message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
